# ============================================================
#  docker-compose.lite.yml
#  $0-Modus: leichte lokale Modelle auf normaler Gaming-GPU
#  (8GB+ VRAM empfohlen). Keine laufenden API-Kosten.
#
#  Start:
#    cp .env.lite.example .env
#    docker compose -f docker-compose.lite.yml up --build -d
#    docker exec -it studio-ollama ollama pull llama3.2
#    docker exec -it studio-ai-worker python -m piper.download_voices de_DE-thorsten-medium
# ============================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: studio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-studio}
      POSTGRES_USER: ${POSTGRES_USER:-studio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-studio_secret}
    volumes: [postgres_data:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    networks: [studio-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-studio}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: studio-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret}
    volumes: [redis_data:/data]
    ports: ["6379:6379"]
    networks: [studio-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: studio-qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-qdrant_secret}
    volumes: [qdrant_data:/qdrant/storage]
    ports: ["6333:6333", "6334:6334"]
    networks: [studio-net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── OLLAMA — lokales LLM für Story-Generierung ───────────────
  # Modell nach dem ersten Start ziehen:
  #   docker exec -it studio-ollama ollama pull llama3.2
  ollama:
    image: ollama/ollama:latest
    container_name: studio-ollama
    restart: unless-stopped
    volumes: [ollama_data:/root/.ollama]
    ports: ["11434:11434"]
    networks: [studio-net]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # Falls keine GPU vorhanden: obigen 'deploy'-Block entfernen,
    # Ollama läuft dann auf CPU (langsamer, aber funktioniert).

  backend:
    build:
      context: ./apps/backend
      dockerfile: ../../infrastructure/docker/backend.Dockerfile
      target: development
    container_name: studio-backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-studio}:${POSTGRES_PASSWORD:-studio_secret}@postgres:5432/${POSTGRES_DB:-studio}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-qdrant_secret}
      AI_WORKER_URL: http://ai-worker:8000
      JWT_SECRET: ${JWT_SECRET:-change_me}
      UPLOAD_PATH: /uploads
      OUTPUT_PATH: /outputs
    volumes:
      - ./apps/backend:/app
      - /app/node_modules
      - character_uploads:/uploads
      - video_output:/outputs
    ports: ["3001:3001"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      qdrant: { condition: service_healthy }
    networks: [studio-net]
    command: npm run start:dev

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: ../../infrastructure/docker/frontend.Dockerfile
      target: development
    container_name: studio-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_WS_URL: ws://localhost:3001
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
      - /app/.next
    ports: ["3000:3000"]
    depends_on: [backend]
    networks: [studio-net]
    command: npm run dev

  # ── AI WORKER — Lite-Modus, moderate GPU-Anforderung ─────────
  ai-worker:
    build:
      context: ./apps/ai-worker
      dockerfile: ../../infrastructure/docker/ai-worker-lite.Dockerfile
    container_name: studio-ai-worker
    restart: unless-stopped
    environment:
      AI_PROVIDER: lite
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      LITE_VIDEO_METHOD: ${LITE_VIDEO_METHOD:-kenburns}
      PIPER_VOICE_DIR: /app/piper_voices
      PIPER_VOICE_DE: ${PIPER_VOICE_DE:-de_DE-thorsten-medium}
      MODEL_CACHE_DIR: /model-cache
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-qdrant_secret}
      OUTPUT_DIR: /outputs
      UPLOAD_DIR: /uploads
      CUDA_VISIBLE_DEVICES: 0
    volumes:
      - ./apps/ai-worker:/app
      - model_cache:/model-cache
      - piper_voices:/app/piper_voices
      - character_uploads:/uploads
      - video_output:/outputs
    ports: ["8000:8000"]
    depends_on:
      qdrant: { condition: service_healthy }
      ollama: { condition: service_started }
    networks: [studio-net]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # Genügt für FLUX.1-schnell auf 8GB+ VRAM. Falls auch das nicht
    # vorhanden ist: LITE_VIDEO_METHOD=kenburns läuft komplett ohne
    # GPU — nur die Bildgenerierung selbst braucht dann zwingend GPU.

networks:
  studio-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  ollama_data:
  model_cache:
  piper_voices:
  character_uploads:
  video_output:
