# ============================================================
#  docker-compose.cloud.yml
#  Cloud-Modus: Nutzung statt docker-compose.yml, wenn KEINE
#  dedizierte GPU vorhanden ist. Video-/Bild-/Sprachgenerierung
#  läuft über gehostete APIs (Replicate, Anthropic, ElevenLabs).
#
#  Start:
#    cp .env.cloud.example .env
#    # API-Keys eintragen
#    docker compose -f docker-compose.cloud.yml up --build
#
#  Unterschiede zur Standard-docker-compose.yml:
#  - ai-worker nutzt ai-worker-cloud.Dockerfile (kein CUDA, ~200MB statt ~15GB Image)
#  - Keine GPU-Reservierung (deploy.resources entfällt)
#  - AI_PROVIDER=cloud erzwingt API-Pfade in allen Pipelines
# ============================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: studio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-studio}
      POSTGRES_USER: ${POSTGRES_USER:-studio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-studio_secret}
    volumes: [postgres_data:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    networks: [studio-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-studio}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: studio-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret}
    volumes: [redis_data:/data]
    ports: ["6379:6379"]
    networks: [studio-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: studio-qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-qdrant_secret}
    volumes: [qdrant_data:/qdrant/storage]
    ports: ["6333:6333", "6334:6334"]
    networks: [studio-net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./apps/backend
      dockerfile: ../../infrastructure/docker/backend.Dockerfile
      target: development
    container_name: studio-backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-studio}:${POSTGRES_PASSWORD:-studio_secret}@postgres:5432/${POSTGRES_DB:-studio}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-qdrant_secret}
      AI_WORKER_URL: http://ai-worker:8000
      JWT_SECRET: ${JWT_SECRET:-change_me}
      UPLOAD_PATH: /uploads
      OUTPUT_PATH: /outputs
    volumes:
      - ./apps/backend:/app
      - /app/node_modules
      - character_uploads:/uploads
      - video_output:/outputs
    ports: ["3001:3001"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      qdrant: { condition: service_healthy }
    networks: [studio-net]
    command: npm run start:dev

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: ../../infrastructure/docker/frontend.Dockerfile
      target: development
    container_name: studio-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_WS_URL: ws://localhost:3001
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
      - /app/.next
    ports: ["3000:3000"]
    depends_on: [backend]
    networks: [studio-net]
    command: npm run dev

  # ── AI WORKER — Cloud-Modus, KEIN GPU nötig ──────────────────
  ai-worker:
    build:
      context: ./apps/ai-worker
      dockerfile: ../../infrastructure/docker/ai-worker-cloud.Dockerfile
    container_name: studio-ai-worker
    restart: unless-stopped
    environment:
      AI_PROVIDER: cloud
      REPLICATE_API_TOKEN: ${REPLICATE_API_TOKEN}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY}
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-qdrant_secret}
      OUTPUT_DIR: /outputs
      UPLOAD_DIR: /uploads
    volumes:
      - ./apps/ai-worker:/app
      - character_uploads:/uploads
      - video_output:/outputs
    ports: ["8000:8000"]
    depends_on:
      qdrant: { condition: service_healthy }
    networks: [studio-net]
    # KEIN deploy.resources.reservations.devices — keine GPU nötig!

networks:
  studio-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  character_uploads:
  video_output:
