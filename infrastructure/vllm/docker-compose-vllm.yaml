# ============================================================
#  infrastructure/vllm/docker-compose-vllm.yaml
#  Ersetzt direktes transformers.generate() im AI-Worker durch
#  einen dedizierten vLLM-Server für Story-Generierung.
#
#  WARUM: model_manager.get_llm() lädt Qwen3 direkt in den
#  AI-Worker-Prozess — das funktioniert, aber jeder gleichzeitige
#  Request blockiert sich gegenseitig (kein Continuous Batching).
#  vLLM übernimmt PagedAttention + Continuous Batching und kann
#  10-20x mehr gleichzeitige Story-Generierungen verarbeiten.
#
#  EINBINDUNG: pipelines/story_gen.py ruft dann statt
#  model_manager.get_llm() einfach die OpenAI-kompatible
#  vLLM-API auf (siehe llm_client.py in diesem Ordner).
#
#  Start: docker compose -f docker-compose-vllm.yaml up -d
# ============================================================

services:
  vllm-qwen3:
    image: vllm/vllm-openai:latest
    container_name: vllm-qwen3
    restart: unless-stopped
    command:
      - "--model=Qwen/Qwen3-8B"
      - "--served-model-name=qwen3"
      - "--gpu-memory-utilization=0.85"
      - "--max-model-len=8192"
      - "--max-num-seqs=32"          # Bis zu 32 parallele Story-Generierungen
      - "--enable-prefix-caching"     # Wiederholte System-Prompts werden gecacht
      - "--dtype=bfloat16"
    ports:
      - "8001:8000"
    volumes:
      - ${MODEL_CACHE_DIR:-./storage/models}/vllm:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Alternative: SGLang statt vLLM ──────────────────────────
  # SGLang ist teils schneller bei strukturierten JSON-Outputs
  # (genau das, was story_gen.py und prompt_builder.py brauchen).
  # Beide APIs sind OpenAI-kompatibel — austauschbar ohne
  # Code-Änderungen im AI-Worker.
  #
  # sglang-qwen3:
  #   image: lmsysorg/sglang:latest
  #   command:
  #     - "python3 -m sglang.launch_server"
  #     - "--model-path Qwen/Qwen3-8B"
  #     - "--port 8000"
  #     - "--json-mode"   # Erzwingt valides JSON — ideal für unsere Prompt-Schemas
  #   ports: ["8002:8000"]
