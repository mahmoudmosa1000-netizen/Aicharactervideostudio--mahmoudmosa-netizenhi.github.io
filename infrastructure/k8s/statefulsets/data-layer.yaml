# ============================================================
#  infrastructure/k8s/statefulsets/data-layer.yaml
#  PostgreSQL, Qdrant, Redis als StatefulSets mit
#  persistentem Storage (überlebt Pod-Neustarts)
# ============================================================

# ── PostgreSQL ────────────────────────────────────────────────
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: ai-studio
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{ containerPort: 5432 }]
          env:
            - { name: POSTGRES_DB, value: studio }
            - { name: POSTGRES_USER, value: studio }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: ai-studio-secrets, key: POSTGRES_PASSWORD } }
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits: { cpu: "2", memory: "4Gi" }
          volumeMounts:
            - { name: postgres-data, mountPath: /var/lib/postgresql/data }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "studio"] }
            initialDelaySeconds: 5
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata: { name: postgres-data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 50Gi } }

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ai-studio
spec:
  clusterIP: None      # Headless — StatefulSet-Standard
  selector: { app: postgres }
  ports: [{ port: 5432 }]

---
# ── Qdrant (Vektor-Datenbank) ───────────────────────────────────
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
  namespace: ai-studio
spec:
  serviceName: qdrant
  replicas: 1
  selector:
    matchLabels: { app: qdrant }
  template:
    metadata:
      labels: { app: qdrant }
    spec:
      containers:
        - name: qdrant
          image: qdrant/qdrant:latest
          ports:
            - { containerPort: 6333, name: rest }
            - { containerPort: 6334, name: grpc }
          env:
            - name: QDRANT__SERVICE__API_KEY
              valueFrom: { secretKeyRef: { name: ai-studio-secrets, key: QDRANT_API_KEY } }
          resources:
            requests: { cpu: "1", memory: "2Gi" }
            limits: { cpu: "4", memory: "8Gi" }
          volumeMounts:
            - { name: qdrant-data, mountPath: /qdrant/storage }
          readinessProbe:
            httpGet: { path: /readyz, port: 6333 }
            initialDelaySeconds: 5
  volumeClaimTemplates:
    - metadata: { name: qdrant-data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 100Gi } }   # Embeddings skalieren mit Charakteranzahl

---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: ai-studio
spec:
  clusterIP: None
  selector: { app: qdrant }
  ports:
    - { port: 6333, name: rest }
    - { port: 6334, name: grpc }

---
# ── Redis (Cache + BullMQ Queue) ────────────────────────────────
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: ai-studio
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["redis-server"]
          args:
            - "--requirepass"
            - "$(REDIS_PASSWORD)"
            - "--maxmemory"
            - "2gb"
            - "--maxmemory-policy"
            - "allkeys-lru"
            - "--appendonly"
            - "yes"          # Persistenz — Render-Jobs dürfen nicht verloren gehen
          ports: [{ containerPort: 6379 }]
          env:
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: ai-studio-secrets, key: REDIS_PASSWORD } }
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1", memory: "2.5Gi" }
          volumeMounts:
            - { name: redis-data, mountPath: /data }
  volumeClaimTemplates:
    - metadata: { name: redis-data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 10Gi } }

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: ai-studio
spec:
  clusterIP: None
  selector: { app: redis }
  ports: [{ port: 6379 }]
