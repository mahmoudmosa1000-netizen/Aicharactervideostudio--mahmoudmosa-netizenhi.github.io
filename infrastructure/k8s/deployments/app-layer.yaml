# ============================================================
#  infrastructure/k8s/deployments/app-layer.yaml
#  Backend (NestJS) + Frontend (Next.js) — reine CPU-Workloads,
#  laufen auf normalen Knoten, horizontal skalierbar.
# ============================================================

# ── Backend ──────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: ai-studio
spec:
  replicas: 3
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      # Nicht auf GPU-Knoten planen — die sind teuer und für AI-Worker reserviert
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - { key: nvidia.com/gpu.present, operator: NotIn, values: ["true"] }
      containers:
        - name: backend
          image: ai-studio/backend:latest
          ports: [{ containerPort: 3001 }]
          envFrom:
            - configMapRef: { name: ai-studio-config }
            - secretRef: { name: ai-studio-secrets }
          env:
            - name: AI_WORKER_URL
              value: "http://ai-worker:8000"
            - name: PORT
              value: "3001"
          resources:
            requests: { cpu: "500m", memory: "512Mi" }
            limits: { cpu: "2", memory: "2Gi" }
          volumeMounts:
            - { name: uploads, mountPath: /uploads }
            - { name: outputs, mountPath: /outputs }
          readinessProbe:
            httpGet: { path: /api/v1/auth/me, port: 3001 }
            initialDelaySeconds: 10
          livenessProbe:
            tcpSocket: { port: 3001 }
            initialDelaySeconds: 15
      volumes:
        - { name: uploads, persistentVolumeClaim: { claimName: uploads-pvc } }
        - { name: outputs, persistentVolumeClaim: { claimName: outputs-pvc } }

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: ai-studio
spec:
  selector: { app: backend }
  ports: [{ port: 3001, targetPort: 3001 }]

---
# ── Frontend ─────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: ai-studio
spec:
  replicas: 2
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: ai-studio/frontend:latest
          ports: [{ containerPort: 3000 }]
          envFrom:
            - configMapRef: { name: ai-studio-config }
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits: { cpu: "1", memory: "1Gi" }
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: ai-studio
spec:
  selector: { app: frontend }
  ports: [{ port: 3000, targetPort: 3000 }]
