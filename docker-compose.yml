version: '3.9'

# ============================================================
#  AI CHARACTER VIDEO STUDIO PRO
#  Phase 1 — docker-compose.yml (Development)
# ============================================================

networks:
  studio-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  model_cache:
  video_output:
  character_uploads:

services:

  # ──────────────────────────────────────────
  # POSTGRES — Hauptdatenbank
  # ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: studio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-studio}
      POSTGRES_USER: ${POSTGRES_USER:-studio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-studio_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - studio-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-studio}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────
  # REDIS — Cache & BullMQ Job Queue
  # ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: studio-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret} --maxmemory 2gb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - studio-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────
  # QDRANT — Vektordatenbank für Embeddings
  # ──────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: studio-qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-qdrant_secret}
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    networks:
      - studio-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────
  # BACKEND — NestJS API
  # ──────────────────────────────────────────
  backend:
    build:
      context: ./apps/backend
      dockerfile: ../../infrastructure/docker/backend.Dockerfile
      target: development
    container_name: studio-backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-studio}:${POSTGRES_PASSWORD:-studio_secret}@postgres:5432/${POSTGRES_DB:-studio}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-qdrant_secret}
      AI_WORKER_URL: http://ai-worker:8000
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_change_in_production}
      UPLOAD_PATH: /uploads
      OUTPUT_PATH: /outputs
    volumes:
      - ./apps/backend:/app
      - /app/node_modules
      - character_uploads:/uploads
      - video_output:/outputs
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - studio-net
    command: npm run start:dev

  # ──────────────────────────────────────────
  # FRONTEND — Next.js 15
  # ──────────────────────────────────────────
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: ../../infrastructure/docker/frontend.Dockerfile
      target: development
    container_name: studio-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_WS_URL: ws://localhost:3001
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - studio-net
    command: npm run dev

  # ──────────────────────────────────────────
  # AI WORKER — Python FastAPI + KI-Modelle
  # ──────────────────────────────────────────
  ai-worker:
    build:
      context: ./apps/ai-worker
      dockerfile: ../../infrastructure/docker/ai-worker.Dockerfile
    container_name: studio-ai-worker
    restart: unless-stopped
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-qdrant_secret}
      MODEL_CACHE_DIR: /model-cache
      OUTPUT_DIR: /outputs
      UPLOAD_DIR: /uploads
      CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:-0}
      # Modell-Auswahl (Variablen in .env setzen)
      VIDEO_MODEL: ${VIDEO_MODEL:-wan2.2}
      IMAGE_MODEL: ${IMAGE_MODEL:-flux-dev}
      LLM_MODEL: ${LLM_MODEL:-qwen3}
      VOICE_MODEL: ${VOICE_MODEL:-xtts-v2}
    volumes:
      - ./apps/ai-worker:/app
      - model_cache:/model-cache
      - character_uploads:/uploads
      - video_output:/outputs
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - studio-net
    # GPU-Zugriff (NVIDIA Container Toolkit vorausgesetzt)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ──────────────────────────────────────────
  # PRISMA STUDIO — DB Admin UI (nur Dev)
  # ──────────────────────────────────────────
  prisma-studio:
    build:
      context: ./apps/backend
      dockerfile: ../../infrastructure/docker/backend.Dockerfile
      target: development
    container_name: studio-prisma-ui
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-studio}:${POSTGRES_PASSWORD:-studio_secret}@postgres:5432/${POSTGRES_DB:-studio}
    volumes:
      - ./apps/backend:/app
      - /app/node_modules
    ports:
      - "5555:5555"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - studio-net
    command: npx prisma studio --port 5555 --browser none
    profiles: ["tools"]

  # ──────────────────────────────────────────
  # NGINX — Reverse Proxy (optional Dev)
  # ──────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: studio-nginx
    volumes:
      - ./infrastructure/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
    networks:
      - studio-net
    profiles: ["proxy"]
